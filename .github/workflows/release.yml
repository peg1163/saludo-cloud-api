name: Publish container image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      container_image: ${{ steps.reference.outputs.container_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test application
        run: ./gradlew clean test --no-daemon

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/saludo-cloud
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and publish
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Record immutable image reference
        id: reference
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/saludo-cloud
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest: $IMAGE_DIGEST" >&2
            exit 1
          fi

          container_image="$IMAGE_NAME@$IMAGE_DIGEST"
          echo "container_image=$container_image" >> "$GITHUB_OUTPUT"

          {
            echo "## Published API image"
            echo
            echo "- API repository: \`${{ github.repository }}\`"
            echo "- Immutable image: \`$container_image\`"
            echo "- Next workflow: \`peg1163/saludo-cloud-iac/.github/workflows/image-contract.yml\`"
          } >> "$GITHUB_STEP_SUMMARY"

  iac-contract:
    needs: publish
    permissions:
      contents: read
    uses: peg1163/saludo-cloud-iac/.github/workflows/image-contract.yml@main
    with:
      container_image: ${{ needs.publish.outputs.container_image }}
